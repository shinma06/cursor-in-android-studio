name: 開発・調査・GUI検証タスク
description: 題名とtype/priority/statusの各1ラベルを指定。QA題名は [試験] #元Issue 要約
title: "[運用] "
labels: ["type:maintenance", "priority:P2", "status:ready"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: 目的・現象
      description: 現在の問題と期待する成果。関連する親Issueも記載。題名はtypeに合わせ [機能]/[修正]/[調査]/[試験]/[運用]/[追跡]。ラベルは各軸1つに変更し、優先度は題名に重ねない。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 範囲・依存
      description: 対象ファイル/機能、対象外、先行Issue/PR、他担当との重なり。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受入条件
      description: チェックリストで記載。Case JSON、再現手順、期待結果、GUI不要なら理由とCLI検証。developとmainの完了を分ける。
    validations:
      required: true
  - type: textarea
    id: tracking
    attributes:
      label: 状態・担当
      value: |
        status: ready
        owner: unassigned
        branch / target / base SHA: unassigned (worktreeはlocal registryのみ)
        reviewer: unassigned
        gui: required / not-required (reason)
        matrix: docs/verification/changes/issue-N.json
        fix / recheck: none
        next: claim後に着手
