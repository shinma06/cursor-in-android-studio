name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Must match the version this plugin is actually developed/tested against
  # locally (see gradle.properties' platformPath comments) and plugin.xml's
  # sinceBuild. ANDROID_STUDIO_CODENAME is the internal release codename, not
  # the marketing version -- the Google CDN download URL uses the codename, not
  # ANDROID_STUDIO_VERSION, in its filename. Look both up together at
  # https://plugins.jetbrains.com/docs/intellij/android-studio-releases-list.html
  # if this ever needs to move to a newer release.
  ANDROID_STUDIO_VERSION: "2026.1.3.8"
  ANDROID_STUDIO_CODENAME: "quail3-patch1"

jobs:
  test:
    # ubuntu, not macos: macOS runner minutes cost 10x on GitHub Actions' free/
    # paid tiers, and nothing here needs macOS -- the JUnit tests are plain JVM
    # code, and Android Studio ships a Linux distribution for exactly this kind
    # of headless/CI use.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Android Studio distribution
        id: cache-android-studio
        uses: actions/cache@v4
        with:
          path: /tmp/android-studio
          key: android-studio-${{ env.ANDROID_STUDIO_VERSION }}-${{ env.ANDROID_STUDIO_CODENAME }}

      - name: Download Android Studio (Linux)
        if: steps.cache-android-studio.outputs.cache-hit != 'true'
        run: |
          # NOTE: the intellijPlatform Gradle plugin's own androidStudio()
          # dependency helper constructs a broken URL for this artifact as of
          # plugin version 2.10.5 (verified by hand: the file below resolves
          # and downloads fine over plain HTTP, but Gradle's own resolution
          # 404s on it) -- see build.gradle.kts's comment. Downloading directly
          # and feeding it in as platformPath sidesteps that entirely.
          curl -fL --retry 3 --retry-delay 5 \
            -o /tmp/android-studio.tar.gz \
            "https://redirector.gvt1.com/edgedl/android/studio/ide-zips/${ANDROID_STUDIO_VERSION}/android-studio-${ANDROID_STUDIO_CODENAME}-linux.tar.gz"
          mkdir -p /tmp/android-studio
          tar -xzf /tmp/android-studio.tar.gz -C /tmp/android-studio --strip-components=1
          rm /tmp/android-studio.tar.gz

      - name: Test GitHub workflow tooling
        run: python3 -m unittest discover -s scripts/workflow -p 'test_*.py'

      - name: Test GUI loop evidence tooling
        run: python3 -m unittest discover -s scripts/loop -p 'test_*.py'

      - name: Run tests
        run: ./gradlew test --console=plain -PplatformPath=/tmp/android-studio
