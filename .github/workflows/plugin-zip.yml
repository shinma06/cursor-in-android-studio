name: Plugin ZIP delivery
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: Full SHA to backfill (empty scans all reachable history)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: plugin-zip-publisher
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'shinma06/cursor-in-android-studio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      commits: ${{ steps.plan.outputs.commits }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          sha = os.environ.get('REQUESTED_SHA', '')
          if sha:
              assert re.fullmatch('[0-9a-f]{40}', sha), 'full SHA required'
              subprocess.run(['git', 'cat-file', '-e', sha + '^{commit}'], check=True)
              commits = json.dumps([sha])
          else:
              commits = subprocess.check_output(['python3', 'scripts/workflow/plugin_zip_publish.py', 'inventory'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('commits=' + commits + '\n')
          PY
  build:
    needs: plan
    if: needs.plan.outputs.commits != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sha: ${{ fromJSON(needs.plan.outputs.commits) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        id: studio
        with:
          path: /tmp/android-studio
          key: android-studio-2026.1.3.8-quail3-patch1
      - if: steps.studio.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o /tmp/studio.tar.gz https://redirector.gvt1.com/edgedl/android/studio/ide-zips/2026.1.3.8/android-studio-quail3-patch1-linux.tar.gz
          mkdir -p /tmp/android-studio
          tar -xzf /tmp/studio.tar.gz -C /tmp/android-studio --strip-components=1
      - name: Build exact historical source without write credentials
        working-directory: source
        run: ./gradlew test buildPlugin --console=plain -PplatformPath=/tmp/android-studio
      - name: Record delivery envelope
        working-directory: source
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          archives = list(pathlib.Path('build/distributions').glob('*.zip'))
          assert len(archives) == 1, 'expected exactly one plugin archive'
          platform = json.loads(pathlib.Path('/tmp/android-studio/product-info.json').read_text())
          platform_label = platform['name'] + ' ' + platform['version'] + ' (' + platform['buildNumber'] + ')'
          jdk = subprocess.run(['java', '-version'], capture_output=True, text=True, check=True).stderr.splitlines()[0]
          subprocess.run(['python3', '../trusted/scripts/workflow/plugin_zip.py', 'record', str(archives[0]), '../delivery',
                          '--recipe', 'gradle-test-buildPlugin-v1', '--platform', platform_label, '--jdk', jdk], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.sha }}
          path: delivery/
          retention-days: 2
  publish:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.commits != '[]'
    strategy:
      fail-fast: false
      matrix:
        sha: ${{ fromJSON(needs.plan.outputs.commits) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: plugin-${{ matrix.sha }}
          path: delivery
      - name: Validate data and publish immutable SHA mapping
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ matrix.sha }}
        run: python3 scripts/workflow/plugin_zip_publish.py publish --sha "$SOURCE_SHA" --directory delivery
